name = "nflsignal-scheduler"
main = "src/index.js"
compatibility_date = "2025-09-01"

[vars]
GITHUB_REPO = "whatsaliju/nfl-betting-automation"
WORKFLOW_FILE = "3_market_update.yml"

# Every 15 minutes, August through February; the Worker picks the Eastern-time slots.
[triggers]
crons = ["*/15 * * 8-12,1-2 *"]
