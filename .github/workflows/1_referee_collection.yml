name: 1. Referee Data Collection

on:
  schedule:
    # Football Zebras usually posts the week's crews by Tuesday evening. Tuesday and
    # Wednesday-morning runs poll for this week's own page and start the pipeline as
    # soon as it appears; once a week's refs are saved, later runs stand down.
    - cron: '0 14 * 8-12,1-2 2'  # Tue 10am ET
    - cron: '0 18 * 8-12,1-2 2'  # Tue 2pm ET
    - cron: '0 22 * 8-12,1-2 2'  # Tue 6pm ET
    - cron: '0 13 * 8-12,1-2 3'  # Wed 9am ET
    - cron: '0 16 * 8-12,1-2 3'  # Wed noon ET
    - cron: '0 19 * 8-12,1-2 3'  # Wed 3pm ET — last call: fallbacks allowed, pipeline starts regardless
  workflow_dispatch:
    inputs:
      week:
        description: 'NFL Week/Round (1-18, WC, DIV, CONF, SB, PRE1, PRE2, PRE3)'
        required: false
        type: string
      season:
        description: 'NFL season year (auto = detect from current_week.json)'
        required: false
        default: 'auto'
        type: string
  repository_dispatch:
    types: [referee-collection-manual]

jobs:
  # GitHub creates phantom push runs whenever any workflow YAML is modified.
  # A workflow with 0 running jobs is marked failure, so we need one job that
  # always succeeds on push to keep the run green.
  skip-push-run:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - run: echo "Phantom push run — skipping referee collection."

  collect_referee_data:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      
      - name: Cache Python dependencies
        uses: actions/cache@v3
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-
      
      - name: Install dependencies
        run: |
          pip install pandas requests beautifulsoup4 lxml
      
      - name: Get Week Number
        id: get_week
        run: |
          SEASON="${{ github.event.inputs.season || github.event.client_payload.season }}"
          [ "$SEASON" = "auto" ] && SEASON=""
          [ -z "$SEASON" ] && SEASON="${{ vars.NFL_SEASON }}"
          [ -z "$SEASON" ] && SEASON=$(python3 -c "import json; print(json.load(open('data/current_week.json')).get('season',''))" 2>/dev/null || echo "")
          [ -z "$SEASON" ] && SEASON=$(python3 -c "import datetime; t=datetime.date.today(); print(t.year if t.month>=9 else t.year-1)")
          START_DATE="${{ vars.NFL_SEASON_START_DATE }}"
          [ -z "$START_DATE" ] && START_DATE="${SEASON}-09-10"
          PRE_START_DATE="${{ vars.NFL_PRESEASON_START_DATE }}"
          [ -z "$PRE_START_DATE" ] && PRE_START_DATE="${SEASON}-08-07"
          MANUAL_WEEK="${{ github.event.inputs.week || github.event.client_payload.week }}"
          if [ -n "$MANUAL_WEEK" ]; then
            WEEK="$MANUAL_WEEK"
          else
            # Date-based formula: Wednesday prep targets the UPCOMING week, not the completed one.
            # ESPN lags — it reports the most recently played week until TNF kicks off Thursday.
            # The formula adds +1 week on Tue/Wed/Thu/Fri so Wednesday always targets next weekend.
            IS_PRESEASON=$(python3 -c "from datetime import datetime; print('yes' if datetime.now() < datetime.strptime('$START_DATE','%Y-%m-%d') else 'no')")
            if [ "$IS_PRESEASON" = "yes" ]; then
              PRE_DAYS=$(python3 -c "from datetime import datetime; print(max(0,(datetime.now()-datetime.strptime('$PRE_START_DATE','%Y-%m-%d')).days))")
              PRE_WEEK=$(( (PRE_DAYS / 7) + 1 ))
              [ "$PRE_WEEK" -gt 4 ] && PRE_WEEK=4
              WEEK="PRE${PRE_WEEK}"
            else
              WEEK=$(python3 -c "from datetime import datetime; s=datetime.strptime('$START_DATE','%Y-%m-%d'); d=(datetime.now()-s).days; raw=d//7+1+(1 if datetime.now().weekday()>=1 else 0); pm={19:'WC',20:'DIV',21:'CONF'}; print(pm.get(raw,'SB') if raw>18 else max(1,min(raw,18)))")
            fi
          fi
          echo "week=$WEEK" >> $GITHUB_OUTPUT
          echo "season=$SEASON" >> $GITHUB_OUTPUT
          echo "📅 NFL Week: $WEEK"
          echo "🏈 NFL Season: $SEASON"

      - name: Normalize week input
        id: clean_week
        run: |
          WEEK="${{ steps.get_week.outputs.week }}"
          WEEK="${WEEK%.*}"
          echo "week=$WEEK" >> $GITHUB_OUTPUT
      # Scheduled runs: stand down if this week's refs are already saved; before Wed 3pm ET
      # accept only Football Zebras' page for this week (no date-matched fallbacks).
      - name: Polling gate
        id: gate
        run: |
          SKIP=false; STRICT=false
          if [ "${{ github.event_name }}" = "schedule" ]; then
            WEEK="${{ steps.clean_week.outputs.week }}"
            FILE="data/week${WEEK}/week${WEEK}_referees.csv"
            if [ -f "$FILE" ] && [ "$(tail -n +2 "$FILE" | grep -c .)" -ge 10 ]; then
              SKIP=true
              echo "::notice::Week $WEEK referee assignments already collected; nothing to do."
            fi
            STRICT=$(TZ=America/New_York python3 -c "from datetime import datetime; n=datetime.now(); print('false' if n.weekday()>=3 or (n.weekday()==2 and n.hour>=15) else 'true')")
          fi
          echo "skip=$SKIP" >> "$GITHUB_OUTPUT"
          echo "strict=$STRICT" >> "$GITHUB_OUTPUT"

      - name: Ensure week directory exists
        if: steps.gate.outputs.skip != 'true'
        run: |
          mkdir -p data/week${{ steps.clean_week.outputs.week }}

      - name: Scrape Referee Assignments
        id: scrape
        if: steps.gate.outputs.skip != 'true'
        run: |
          echo "🏈 Scraping Week ${{ steps.clean_week.outputs.week }} referee assignments..."
          python3 << PYTHON_EOF
          import os, sys
          sys.path.append('scrapers')
          from football_zebras_scraper import save_referees
          week_str = "${{ steps.clean_week.outputs.week }}"
          week = int(week_str) if week_str.isdigit() else week_str
          year = int("${{ steps.get_week.outputs.season }}")
          strict = "${{ steps.gate.outputs.strict }}" == "true"
          df = save_referees(week, year=year, strict=strict)
          found = df is not None and len(df) > 0
          with open(os.environ["GITHUB_OUTPUT"], "a") as out:
              out.write(f"found={'true' if found else 'false'}\n")
          if not found:
              print(f"⚠️ No referee assignments found for week {week} (not posted yet)")
              exit(0)
          print(f"✅ Got {len(df)} games")
          PYTHON_EOF
      
      - name: Generate Referee Context Queries (using Odds API)
        if: steps.gate.outputs.skip != 'true' && (steps.scrape.outputs.found == 'true' || steps.gate.outputs.strict != 'true')
        env:
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: |
          echo "🔍 Generating referee context queries using Odds API..."
          python3 analyzers/query_generator.py ${{ steps.clean_week.outputs.week }}
      
      - name: Build Referee Trends from nflverse
        if: steps.gate.outputs.skip != 'true' && (steps.scrape.outputs.found == 'true' || steps.gate.outputs.strict != 'true')
        run: |
          echo "📈 Building referee trends from public nflverse schedules..."
          python3 analyzers/nflverse_referee_trends.py ${{ steps.clean_week.outputs.week }}

      
      - name: Generate Referee Trends Digest
        if: steps.gate.outputs.skip != 'true' && (steps.scrape.outputs.found == 'true' || steps.gate.outputs.strict != 'true')
        run: |
          echo "📋 Generating referee trends digest..."
          python3 << PYTHON_EOF
          import sys
          sys.path.append('analyzers')
          from referee_trend_generator import generate_referee_digest
          week_str = "${{ steps.clean_week.outputs.week }}"
          generate_referee_digest(int(week_str) if week_str.isdigit() else week_str)
          PYTHON_EOF
      
      - name: Commit Referee Data
        if: steps.gate.outputs.skip != 'true' && (steps.scrape.outputs.found == 'true' || steps.gate.outputs.strict != 'true')
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main || true
          git add data/week${{ steps.clean_week.outputs.week }}/ \
                  data/historical/sdql_results.csv || true
          git commit -m "🏈 Week ${{ steps.clean_week.outputs.week }} referee data collection" || echo "No changes"
          git push
      
      - name: Trigger Initial Market Data Workflow
        if: steps.gate.outputs.skip != 'true' && (steps.scrape.outputs.found == 'true' || steps.gate.outputs.strict != 'true')
        uses: peter-evans/repository-dispatch@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          event-type: referee-data-ready
          client-payload: '{"week": "${{ steps.clean_week.outputs.week }}", "season": "${{ steps.get_week.outputs.season }}"}'
      
      - name: Summary
        run: |
          echo "✅ Referee data collection complete for Week ${{ steps.clean_week.outputs.week }}"
          echo "📁 Files created:"
          ls -lh data/week${{ steps.clean_week.outputs.week }}/*.csv data/week${{ steps.clean_week.outputs.week }}/*.txt data/historical/sdql_results.csv
