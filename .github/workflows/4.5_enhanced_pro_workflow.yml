name: 4.5 Pro Analysis & Email (Enhanced Organized)

on:
  repository_dispatch:
    types: [initial-market-data, market-data-ready]
  workflow_dispatch:
    inputs:
      week:
        description: 'NFL Week (PRE1, 1-18, WC, DIV, SB) — leave as "auto" to detect from data'
        required: false
        default: 'auto'
        type: string
      analysis_type:
        description: 'final = game-day picks (default); initial = early-week first look'
        required: false
        default: 'final'
        type: choice
        options: [final, initial]
      season_type:
        description: 'Season type — "auto" infers from week label'
        required: false
        default: 'auto'
        type: choice
        options: [auto, PRE, REG, POST]
      season:
        description: 'Season year'
        required: false
        default: '2026'
        type: string

jobs:
  generate_analysis:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install pandas numpy requests

      - name: Get Week and Detect Type
        id: info
        run: |
          SEASON="${{ github.event.inputs.season }}"
          [ -z "$SEASON" ] && SEASON="${{ github.event.client_payload.season }}"
          [ -z "$SEASON" ] && SEASON="${{ vars.NFL_SEASON }}"
          [ -z "$SEASON" ] && SEASON="2026"

          # Resolve week: explicit input (non-auto) > repository_dispatch payload > auto-detect from data files
          INPUT_WEEK="${{ github.event.inputs.week }}"
          if [ -n "$INPUT_WEEK" ] && [ "$INPUT_WEEK" != "auto" ]; then
            WEEK="$INPUT_WEEK"
          elif [ -n "${{ github.event.client_payload.week }}" ]; then
            WEEK="${{ github.event.client_payload.week }}"
          else
            WEEK=$(python3 - <<'PYEOF'
import glob, re
files = glob.glob('data/week*/week*_referees.csv')
def sort_key(w):
    u = w.upper()
    if u.startswith('PRE'):
        try: return (-2, int(u[3:]) if u[3:] else 1)
        except: return (-2, 1)
    for label, rank in [('WC',19),('DIV',20),('CONF',21),('CON',21),('SB',22)]:
        if u == label: return (2, rank)
    try: return (1, int(w))
    except: return (0, 0)
weeks = [m.group(1) for f in files for m in [re.search(r'week([A-Za-z0-9]+)_referees', f)] if m]
if weeks:
    weeks.sort(key=sort_key)
    print(weeks[-1])
PYEOF
)
          fi

          # Infer season type from week label; respect explicit override
          SEASON_TYPE="${{ github.event.inputs.season_type }}"
          [ -z "$SEASON_TYPE" ] || [ "$SEASON_TYPE" = "auto" ] && SEASON_TYPE=""
          [ -z "$SEASON_TYPE" ] && SEASON_TYPE="${{ github.event.client_payload.season_type }}"
          if [ -z "$SEASON_TYPE" ]; then
            if echo "$WEEK" | grep -qiE '^PRE'; then
              SEASON_TYPE="PRE"
            elif echo "$WEEK" | grep -qiE '^(WC|DIV|CONF|CON|SB)$'; then
              SEASON_TYPE="POST"
            else
              SEASON_TYPE="REG"
            fi
          fi

          # Resolve analysis stage
          TYPE="${{ github.event.inputs.analysis_type }}"
          [ -z "$TYPE" ] && TYPE="${{ github.event.client_payload.analysis_type }}"
          [ -z "$TYPE" ] && TYPE="final"

          case "$TYPE" in
            "initial")
              STAGE="initial"
              PREFIX="🏈 Initial"
              ;;
            "update")
              STAGE="update"
              PREFIX="🔄 Update"
              ;;
            "lock")
              STAGE="lock"
              PREFIX="🔒 Locked Picks"
              ;;
            *)
              STAGE="final"
              PREFIX="🚨 Final"
              ;;
          esac

          echo "week=$WEEK" >> $GITHUB_OUTPUT
          echo "season=$SEASON" >> $GITHUB_OUTPUT
          echo "season_type=$SEASON_TYPE" >> $GITHUB_OUTPUT
          echo "stage=$STAGE" >> $GITHUB_OUTPUT
          echo "prefix=$PREFIX" >> $GITHUB_OUTPUT
          echo "time=$(date '+%Y-%m-%d %I:%M %p ET')" >> $GITHUB_OUTPUT

      - name: Resolve Data Files
        id: files
        run: |
          latest_file() {
            python3 -c 'import glob, os, sys; files=[]; [files.extend(glob.glob(p)) for p in sys.argv[1:]]; files.sort(key=os.path.getmtime, reverse=True); print(files[0] if files else "")' "$@"
          }
          # Prefer explicitly passed paths (repository_dispatch), fall back to latest on disk
          MARKETS="${{ github.event.client_payload.action_markets_file }}"
          INJURIES="${{ github.event.client_payload.action_injuries_file }}"
          WEATHER="${{ github.event.client_payload.action_weather_file }}"
          ROTOWIRE="${{ github.event.client_payload.rotowire_file }}"
          [ -z "$MARKETS" ]  && MARKETS=$(latest_file "data/action_all_markets_*.csv")
          [ -z "$INJURIES" ] && INJURIES=$(latest_file "data/action_injuries_*.csv")
          [ -z "$WEATHER" ]  && WEATHER=$(latest_file "data/action_weather_*.csv")
          echo "markets=$MARKETS"
          echo "injuries=$INJURIES"
          echo "weather=$WEATHER"
          echo "rotowire=$ROTOWIRE"
          echo "markets=$MARKETS"   >> $GITHUB_OUTPUT
          echo "injuries=$INJURIES" >> $GITHUB_OUTPUT
          echo "weather=$WEATHER"   >> $GITHUB_OUTPUT
          echo "rotowire=$ROTOWIRE" >> $GITHUB_OUTPUT

      - name: Run Pro Analyzer
        env:
          ACTION_MARKETS_FILE: ${{ steps.files.outputs.markets }}
          ACTION_INJURIES_FILE: ${{ steps.files.outputs.injuries }}
          ACTION_WEATHER_FILE: ${{ steps.files.outputs.weather }}
          ROTOWIRE_FILE: ${{ steps.files.outputs.rotowire }}
          REFEREE_TRENDS_FILE: data/historical/sdql_results.csv
          NFL_SEASON: ${{ steps.info.outputs.season }}
          NFL_SEASON_TYPE: ${{ steps.info.outputs.season_type }}
        run: |
          WEEK=${{ steps.info.outputs.week }}
          python3 -m analyzers.nfl_pro_analyzer $WEEK

      - name: Validate Analysis Artifacts
        run: |
          WEEK=${{ steps.info.outputs.week }}
          SEASON_TYPE=${{ steps.info.outputs.season_type }}
          ALLOW_UNSAFE=""
          [ "$SEASON_TYPE" = "PRE" ] && ALLOW_UNSAFE="--allow-unsafe"
          python3 scripts/validate_engine_contracts.py --run-dir data/week$WEEK $ALLOW_UNSAFE

      - name: Organize and Metadata
        env:
          WEEK: ${{ steps.info.outputs.week }}
          STAGE: ${{ steps.info.outputs.stage }}
        run: |
          WEEK_DIR="data/week$WEEK"
          # 1. Rename files for organization
          [ -f "$WEEK_DIR/week${WEEK}_analytics.json" ] && cp "$WEEK_DIR/week${WEEK}_analytics.json" "$WEEK_DIR/$STAGE.json"
          [ -f "$WEEK_DIR/week${WEEK}_analytics.csv" ] && cp "$WEEK_DIR/week${WEEK}_analytics.csv" "$WEEK_DIR/$STAGE.csv"
          [ -f "$WEEK_DIR/week${WEEK}_pro_analysis.txt" ] && cp "$WEEK_DIR/week${WEEK}_pro_analysis.txt" "$WEEK_DIR/${STAGE}_pro_analysis.txt"
          [ -f "$WEEK_DIR/week${WEEK}_selector_audit.csv" ] && cp "$WEEK_DIR/week${WEEK}_selector_audit.csv" "$WEEK_DIR/${STAGE}_selector_audit.csv"
          [ -f "$WEEK_DIR/week${WEEK}_run_manifest.json" ] && cp "$WEEK_DIR/week${WEEK}_run_manifest.json" "$WEEK_DIR/${STAGE}_run_manifest.json"
          [ -f "$WEEK_DIR/week${WEEK}_source_health.json" ] && cp "$WEEK_DIR/week${WEEK}_source_health.json" "$WEEK_DIR/${STAGE}_source_health.json"
          [ -f "$WEEK_DIR/week${WEEK}_source_health.txt" ] && cp "$WEEK_DIR/week${WEEK}_source_health.txt" "$WEEK_DIR/${STAGE}_source_health.txt"

          # 2. Advanced Metadata Python
          python3 << 'EOF'
          import json, os, datetime
          week, stage = os.environ['WEEK'], os.environ['STAGE']
          
          # Handle all week label types
          def get_week_number(week_str):
              playoff_weeks = {'WC': 19, 'DIV': 20, 'CONF': 21, 'CON': 21, 'SB': 22}
              w = str(week_str).strip().upper()
              if w in playoff_weeks:
                  return playoff_weeks[w]
              if w.startswith('PRE'):
                  return 0
              try:
                  return int(w)
              except (ValueError, TypeError):
                  return 0
          
          path = f'data/week{week}/metadata.json'
          if os.path.exists(path):
              with open(path, 'r') as f: meta = json.load(f)
          else:
              meta = {'week': get_week_number(week), 'stages': []}  # ✅ Now handles "WC"
          
          g_count = 0
          try:
              with open(f'data/week{week}/{stage}.json', 'r') as f:
                  data = json.load(f)
                  g_count = len(data) if isinstance(data, list) else 0
          except: pass

          meta['stages'] = [s for s in meta['stages'] if s.get('stage') != stage]
          meta['stages'].append({
              'stage': stage,
              'games': g_count,
              'timestamp': datetime.datetime.now().isoformat()
          })
          with open(path, 'w') as f: json.dump(meta, f, indent=2)
          EOF

      - name: Send Enhanced Professional Email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          # Fix: Use the 'info' step outputs
          WEEK: ${{ steps.info.outputs.week }}
          TIMESTAMP: ${{ steps.info.outputs.time }}
          ANALYSIS_TYPE: ${{ steps.info.outputs.stage }}
          SUBJECT_PREFIX: ${{ steps.info.outputs.prefix }}
          NFL_SEASON: ${{ steps.info.outputs.season }}
          NFL_SEASON_TYPE: ${{ steps.info.outputs.season_type }}
          FLIP_ALERT: ""
          PYTHONPATH: .
        run: python3 analyzers/nfl_reporter.py

      - name: Build Week Master Table
        run: |
          python3 builders/build_week_master_table.py \
            --season ${{ steps.info.outputs.season }} \
            --week ${{ steps.info.outputs.week }} \
            --season-type ${{ steps.info.outputs.season_type }}

      - name: Build Matrix Engine Feed
        run: |
          python3 builders/build_matrix_engine_feed.py
          python3 builders/build_game_feature_table.py
          python3 scripts/audit_game_features.py
          python3 scripts/generate_feature_research_report.py \
            --features data/historical/game_features.csv \
            --audit data/historical/game_feature_audit.csv \
            --json-output data/historical/feature_research_report.json \
            --md-output data/historical/feature_research_report.md
          if [ -f data/backtests/engine_2026_1_configured/game_features.csv ]; then
            python3 scripts/build_model_training_dataset.py
            python3 scripts/evaluate_factor_promotion.py
            python3 scripts/simulate_promotion_overlays.py
            python3 scripts/audit_source_reliability.py
            python3 scripts/audit_warps_selector_alignment.py
            python3 scripts/build_market_edge_ledger.py
            python3 scripts/audit_closing_line_value.py
            python3 scripts/generate_backtest_coverage_report.py
            python3 scripts/build_pick_explanations.py \
              --features data/backtests/engine_2026_1_configured/game_features.csv \
              --json-output data/backtests/engine_2026_1_configured/pick_explanations.json \
              --csv-output data/backtests/engine_2026_1_configured/pick_explanations.csv \
              --md-output data/backtests/engine_2026_1_configured/pick_explanations.md
          fi
          python3 scripts/build_pick_explanations.py
          python3 scripts/build_weekly_betting_card.py
          python3 builders/build_matrix_engine_feed.py

      - name: Commit Changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "📊 Week ${{ steps.info.outputs.week }} analysis update" || exit 0
          git push
