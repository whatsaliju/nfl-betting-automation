name: 5. Send Conversational Analysis Email

on:
  push:
    branches:
      - main
    paths:
      - 'data/**/week*_executive_summary.txt'
      - 'data/historical/matrix_engine_feed.json'

jobs:
  send_email:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Determine Week and Context
        id: file_vars
        run: |
          CHANGED_FILE=$(git diff --name-only ${{ github.event.before }} ${{ github.sha }} | grep -E 'data/week[A-Za-z0-9]+/week[A-Za-z0-9]+_executive_summary.txt' | head -n 1)

          if [ -z "$CHANGED_FILE" ]; then
            WEEK_NUM=$(python3 -c "import json; d=json.load(open('data/historical/matrix_engine_feed.json')); print(d.get('current_context',{}).get('week','unknown') or 'unknown')" 2>/dev/null || echo "unknown")
            if [ "$WEEK_NUM" = "unknown" ] || [ -z "$WEEK_NUM" ]; then
              echo "::warning::No data file found. Skipping email."
              exit 0
            fi
          else
            WEEK_NUM=$(echo "$CHANGED_FILE" | grep -oP 'week\K[A-Za-z0-9]+' | head -n 1)
          fi

          DAY_OF_WEEK=$(date +%u)
          IS_PRESEASON=false
          echo "$WEEK_NUM" | grep -qiP '^PRE' && IS_PRESEASON=true

          if [ "$IS_PRESEASON" = "true" ]; then
            ANALYSIS_TYPE="PRESEASON DRY RUN"
            SUBJECT_PREFIX="PRE WEEK"
            INTRO_TEXT="Preseason dry run. Markets are thin and lineups are unavailable. Referee history is from the regular season. Treat picks as informational only."
          else
            case $DAY_OF_WEEK in
              3)
                ANALYSIS_TYPE="MIDWEEK ANALYSIS"
                SUBJECT_PREFIX="MIDWEEK (REFS LOCKED)"
                INTRO_TEXT="Referee assignments are locked and integrated. First comprehensive look at the week combining stats, refs, and situational factors with sharp money signals."
                ;;
              5)
                ANALYSIS_TYPE="FINAL ANALYSIS"
                SUBJECT_PREFIX="FINAL LINEUPS"
                INTRO_TEXT="Final report for the weekend. Major injury reports processed and late-week line movement accounted for."
                ;;
              *)
                ANALYSIS_TYPE="MARKET UPDATE"
                SUBJECT_PREFIX="MARKET UPDATE"
                INTRO_TEXT="Quick summary of the week's sharp money and model plays. Full edge board and WARPS data on the dashboard."
                ;;
            esac
          fi

          TIME_STAMP=$(date +"%b %d, %Y %H:%M ET")
          echo "week=$WEEK_NUM" >> $GITHUB_OUTPUT
          echo "analysis_type=$ANALYSIS_TYPE" >> $GITHUB_OUTPUT
          echo "subject_prefix=$SUBJECT_PREFIX" >> $GITHUB_OUTPUT
          echo "intro_text=$INTRO_TEXT" >> $GITHUB_OUTPUT
          echo "flip_alert=" >> $GITHUB_OUTPUT
          echo "time=$TIME_STAMP" >> $GITHUB_OUTPUT

      - name: Send Betting Card Email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USERNAME }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          WEEK: ${{ steps.file_vars.outputs.week }}
          TIME_STAMP: ${{ steps.file_vars.outputs.time }}
          ANALYSIS_TYPE: ${{ steps.file_vars.outputs.analysis_type }}
          SUBJECT_PREFIX: ${{ steps.file_vars.outputs.subject_prefix }}
          INTRO_TEXT: ${{ steps.file_vars.outputs.intro_text }}
          FLIP_ALERT: ${{ steps.file_vars.outputs.flip_alert }}
        run: python3 scripts/send_betting_card_email.py
